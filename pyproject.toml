[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uncluttered-memory"
version = "0.1.0"
description = "Full-lifecycle agent memory: judge-gated writes, judge-reranked reads, signed provenance, provable claims"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.scripts]
unclutter = "uncluttered_memory.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["uncluttered_memory*"]