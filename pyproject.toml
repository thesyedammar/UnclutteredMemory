[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uncluttered-memory"
version = "0.1.0"
description = "Full-lifecycle agent memory: judge-gated writes, judge-reranked reads, signed provenance, provable claims"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.scripts]
unclutter = "uncluttered_memory.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["uncluttered_memory*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Repo-root relative imports for the tests: src holds the package,
# "." makes the eval harness importable. The package itself installs
# with pip install -e . (src layout, package-dir above).
pythonpath = ["src", "."]
